name: send-reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 触发提醒检查（到点自动发邮件）
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://cyyinfo.pages.dev/api/reminders/check" \
            -H "x-reminder-token: ${{ secrets.REMINDER_TOKEN }}")
          echo "reminders/check -> HTTP $code"
          if [ "$code" != "200" ]; then exit 1; fi
