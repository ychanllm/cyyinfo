name = "cyyinfo"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[vars]
JWT_EXPIRE_HOURS = "72"
ADMIN_USERNAME = "admin"
# 敏感项（ADMIN_PASSWORD / JWT_SECRET）不入库：
#   - 本地开发：web/.dev.vars
#   - 生产环境：Pages 后台「环境变量」或 wrangler pages secret put 注入

[[d1_databases]]
binding = "DB"
database_name = "cyyinfo-db"
database_id = "c8f4912f-bf69-4aca-8ff4-c266649799bc"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "cyyinfo-uploads"
